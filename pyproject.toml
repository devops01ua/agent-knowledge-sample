[project]
name = "acme-kb"
version = "0.1.0"
description = "CLI for a markdown knowledge repo shared by a team's coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
acme-kb = "acme_kb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tools"]

[tool.setuptools.package-data]
acme_kb = ["search.schema.json"]
